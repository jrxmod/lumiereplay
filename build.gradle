plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "lumiereplay" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Minecraft & mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // VLCJ — embed in mod jar so end-user only needs libvlc, not vlcj on classpath
    include(implementation('uk.co.caprica:vlcj:4.8.3'))
    include(implementation('uk.co.caprica:vlcj-natives:4.8.3'))

    // Gson — embed in mod jar
    include(implementation('com.google.code.gson:gson:2.10.1'))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // withSourcesJar() intentionally omitted — it conflicts with
    // Loom 1.8.x remapJar and produced a 261-byte empty jar in 0.5.4.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    // License required by Apache-2.0 license terms
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
